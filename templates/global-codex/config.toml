personality = "pragmatic"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

[agents]
# Compatibility alias: Codex 0.144.1 rejects the newer
# max_concurrent_threads_per_session key, while both tested CLIs accept this.
max_threads = 2

[sandbox_workspace_write]
writable_roots = []
network_access = false

# Models, reasoning effort, MCP servers, and app integrations are intentionally
# user-owned. This portable base controls only safe workflow defaults.
