# ⚠️ PROTOTYPE MODE CONFIG — LOCAL TESTING ONLY
# Do NOT use this config for production, staging, or shared workspaces.
# This config trades governance depth for raw iteration speed.
#
# Usage: copy to your prototype workspace as .codex/config.toml
#        OR run `codex --config path/to/this/config.toml`

model = "gpt-5.5-mini"         # faster and cheaper — fine for rapid local iteration
approval_policy = "never"       # no interruptions — maximum iteration speed
sandbox_mode = "workspace-write"
web_search = "cached"

[agents]
max_threads = 2                 # lean — prototype runs do not need full fan-out
max_depth = 1                   # single layer — no nested sub-orchestration

[sandbox_workspace_write]
writable_roots = []
network_access = false          # local only — do not enable for prototype work

# Prototype profile — activate with: codex --profile prototype
[profiles.prototype]
model = "gpt-5.5-mini"
model_reasoning_effort = "medium"   # fast answers over deep analysis
approval_policy = "never"
web_search = "cached"

# Notes on prototype config decisions:
#
# model = "gpt-5.5-mini"
#   Chosen for speed and cost. Switch to "gpt-5.5" only if the task
#   requires deeper reasoning that mini cannot handle.
#
# approval_policy = "never"
#   Removes all approval interruptions. This is safe only because prototype
#   output is local-only and not pushed to production.
#
# network_access = false
#   Prototype code must not reach production services. Keep this false.
#   If your prototype genuinely needs live network access, set to true and
#   document why in the task — but do not connect to production endpoints.
#
# When to upgrade to the full config:
#   Switch back to templates/global-codex/config.toml as soon as:
#   - the prototype is validated and ready for migration
#   - you need multi-agent department routing
#   - you need the full validator + tester gates
